不启动其他子智能体，不暂存、提交、推送或执行其他 Git 写入；需要新的研究分支或扩大范围时向主智能体说明。

输出结论与适用范围、版本和证据位置、可行方案及限制、最小验证方法，以及实际执行和未执行的检查。参考实现存在不等于本项目已验证可用。
